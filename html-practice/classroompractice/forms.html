<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form >
        <label for ="name" >Name: </label>
        <input  id="name" type="text" placeholder="Enter your name" name="name">
        
        <br>
        <br>

        <label for ="email">Email:</label>
        <input id="email" type="email" placeholder="Enter your email" name="email">

        <br>
        <br>
        <label for ="password">Password:</label>
        <input id="password" type="password" name="password"> 
<label>skill:</label>

            <option>Html</option>
            <option>Css</option>
            <option>JavaScript</option>
        </select>
        <section>
            <label>Gender:</label>

            <label for="male">Male</label>

        </section>

            <input type="checkbox" value ="html">

            <input type="checkbox" value ="css">

            <input type="checkbox" value ="javascript">
            <label>JavaScript</label>


        </section>
        <br>
        <label for ="date">Date:</label>
        <input id="date" type="date" name="date">
        <textarea></textarea>
        <br>
        <input type="file" name="file"><br>
        <input type="range" max="3">
            
       
        <button type="submit" >Submit</button>
    </form>
</body>
</html>
