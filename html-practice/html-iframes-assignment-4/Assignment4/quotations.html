<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Quotations</title>
</head>
<body>

    <h1>HTML Quotations</h1>

    <h2>Long Quotation</h2>

    <blockquote>
        The only way to do great work is to love what you do.
        Always believe in yourself and keep learning new things.
        &lt;Success&gt; comes with continuous effort.
    </blockquote>

    <h2>Short Quotation</h2>

    <p>
        My favorite quote is:
        <q>Believe in yourself and never give up.</q>
    </p>

</body>
</html>
