<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Map</title>
</head>
<body>

    <h1>My City - Mathura</h1>

    <!-- loading="lazy" loads the map only when it is near the viewport,
         which helps improve page loading performance. -->

    <iframe
        src="https://www.google.com/maps?q=Mathura,Uttar%20Pradesh&output=embed"
        width="600"
        height="450"
        title="Google Map showing Mathura"
        loading="lazy">
    </iframe>

</body>
</html>
