<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Iframe</title>
</head>
<body>

    <h1>Submit Form</h1>

    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Enter your name:</label>
        <input type="text" id="name" name="name" required>

        <button type="submit">Submit</button>

    </form>

    <br>

    <iframe
        name="resultFrame"
        width="80%"
        height="200"
        title="Result">
    </iframe>

</body>
</html>
