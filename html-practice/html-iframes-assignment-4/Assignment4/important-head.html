<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Sets the title displayed on the browser tab -->
    <title>Important Head Elements</title>

    <!-- Defines the character encoding of the webpage -->
    <meta charset="UTF-8">

    <!-- Provides a short description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Srishti Pandey">

    <!-- Defines the base URL for relative links -->
    <base href="https://example.com/">

    <!-- Specifies the favicon/resource for the webpage -->
    <link rel="icon" href="favicon.ico">

    <!-- CSS can be written inside the style element -->
    <style>
    </style>

    <!-- JavaScript can be written inside the script element -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This webpage demonstrates important elements used inside the
        HTML head section.
    </p>

</body>

</html>
