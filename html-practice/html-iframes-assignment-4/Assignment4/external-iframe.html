<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External Website using Iframe</title>
</head>
<body>

    <h1>Wikipedia in Iframe</h1>

    <iframe
        src="https://www.wikipedia.org/"
        width="80%"
        height="500"
        title="Wikipedia Website">
    </iframe>

    <p>
        Some websites may not allow embedding for security reasons.
    </p>

</body>
</html>
