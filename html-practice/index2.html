<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e8e5c5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 320px;
            padding: 30px 25px;
            background: #f4f5d8;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        .profile {
            width: 100px;
            height: 100px;
            background: #e7ddc8;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #777;
            font-size: 18px;
        }

        h1 {
            font-size: 25px;
            color: #333;
            margin-bottom: 8px;
        }

        h3 {
            font-size: 16px;
            color: #555;
            margin-bottom: 8px;
        }

        .college {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .about {
            color: #555;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .skills-title {
            font-size: 18px;
            color: #555;
            margin-bottom: 12px;
        }

        .skills {
            color: #2878b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: #3b82d0;
            color: white;
            text-decoration: none;
            padding: 13px 22px;
            border-radius: 6px;
            font-size: 14px;
        }

        .btn:hover {
            background: #256bb0;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="profile">
            Student
        </div>

        <h1>Srishti Pandey</h1>

        <h3>Computer Science Engineering</h3>

        <p class="college">
           GLA University Mathura, Uttar Pradesh, India
        </p>

        <p class="about">
            I am a passionate Computer Science student interested
            in Web Development, Java, and problem solving.
        </p>

        <h2 class="skills-title">Skills</h2>

        <p class="skills">
            HTML&nbsp;&nbsp; CSS&nbsp;&nbsp; Java&nbsp;&nbsp; Problem Solving
        </p>

        <a href="#" class="btn">Contact Me</a>

    </div>

</body>
</html>
