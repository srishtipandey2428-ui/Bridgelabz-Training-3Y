<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Photo Gallery</h1>
        <p>A collection of beautiful moments</p>
    </header>

    <main class="gallery">

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                 alt="Nature">
            <div class="caption">Beautiful Nature</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                 alt="Mountain">
            <div class="caption">Mountain View</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                 alt="Forest">
            <div class="caption">Green Forest</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                 alt="Beach">
            <div class="caption">Peaceful Beach</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8"
                 alt="Sunset">
            <div class="caption">Beautiful Sunset</div>
        </div>

        <div class="photo">
            <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b"
                 alt="Mountains">
            <div class="caption">Amazing Mountains</div>
        </div>

    </main>

    <footer>
        <p>&copy; 2026 My Photo Gallery</p>
    </footer>

</body>
</html>
